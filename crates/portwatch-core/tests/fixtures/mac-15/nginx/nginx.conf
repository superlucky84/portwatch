worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen       8080;
        server_name  localhost;

        location /api {
            proxy_pass http://127.0.0.1:3000;
        }

        location /intranet {
            proxy_pass http://intranet.example.test:8081;
        }

        location / {
            root   html;
            index  index.html index.htm;
        }
    }

    include servers/*;
}
