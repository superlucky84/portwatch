upstream shop_web {
    server 127.0.0.1:5173;
}

server {
    listen       443 ssl;
    server_name  shop.example.test;

    ssl_certificate      /opt/homebrew/etc/nginx/certs/shop.example.test.pem;
    ssl_certificate_key  /opt/homebrew/etc/nginx/certs/shop.example.test-key.pem;

    location / {
        proxy_pass http://shop_web;
    }
}
