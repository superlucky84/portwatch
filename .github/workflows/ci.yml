name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mac:
        description: macOS 앱을 빌드해 artifact로 올린다
        type: boolean
        default: true
      scenario:
        description: macOS 실행기에서 brew nginx(사용자·root 서비스)와 분리 실행 서버로 탐지 시나리오를 돌린다(Phase 6)
        type: boolean
        default: true

permissions:
  contents: read

# 같은 브랜치·PR에 새 푸시가 오면 이전 실행을 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Linux / 코어 검사와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: rustup component add rustfmt clippy
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  mac:
    # 공개 저장소라 macOS 실행기도 무료여서 푸시·PR마다 돌린다. 수동 실행에서는 입력으로 끌 수 있다(DC-10).
    if: github.event_name != 'workflow_dispatch' || inputs.build_mac
    name: macOS / 앱 빌드
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: rustup component add clippy
      - run: npm ci --no-audit --no-fund
      - run: npm run check:app
      - run: npm run build:mac
      - run: cargo build --release -p portwatch-collect --bin portwatch-probe
      - name: 빌드 결과 확인
        run: |
          app=target/release/bundle/macos/portwatch.app
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/portwatch"
      # 실행기의 실제 macOS 출력으로 탐지 흐름을 한 번 돌려 본다. 실행기에는 개인 정보가 없다.
      - name: 실행기에서 portwatch-probe 실행
        run: |
          sw_vers -productVersion
          target/release/portwatch-probe
          target/release/portwatch-probe --raw
      - name: 묶기
        run: |
          mkdir -p dist/portwatch-macos-arm64
          ditto target/release/bundle/macos/portwatch.app dist/portwatch-macos-arm64/portwatch.app
          cp target/release/portwatch-probe dist/portwatch-macos-arm64/
          ditto -c -k --keepParent dist/portwatch-macos-arm64 portwatch-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: portwatch-macos-arm64
          path: portwatch-macos-arm64.zip
          # zip을 한 번 더 압축하지 않고 그대로 올린다.
          archive: false
          retention-days: 14

  mac-scenario:
    # 실제 서비스로 탐지·주소·인증서·멈추기 계획을 확인한다. 실행기에는 비밀번호 없는 sudo가 있다.
    if: github.event_name != 'workflow_dispatch' || inputs.scenario
    name: macOS / 실제 서비스 시나리오
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: cargo build --release -p portwatch-collect --bin portwatch-probe
      - name: 분리 실행 서버와 nginx 설정
        run: |
          nohup node -e "require('http').createServer((q, s) => s.end('ok')).listen(18081, '127.0.0.1')" > "$RUNNER_TEMP/node.log" 2>&1 &
          brew install nginx
          conf="$(brew --prefix)/etc/nginx/servers"
          mkdir -p "$conf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 7 \
            -keyout "$RUNNER_TEMP/pw.key" -out "$RUNNER_TEMP/pw.crt" \
            -subj "/O=portwatch CI/CN=localhost" -addext "subjectAltName=DNS:localhost"
          cat > "$conf/portwatch.conf" <<EOF
          server {
              listen 18443 ssl;
              server_name localhost;
              ssl_certificate $RUNNER_TEMP/pw.crt;
              ssl_certificate_key $RUNNER_TEMP/pw.key;
              location / { proxy_pass http://127.0.0.1:18081; }
          }
          EOF
      - name: 사용자 brew 서비스
        run: |
          brew services start nginx
          sleep 5
          target/release/portwatch-probe
          target/release/portwatch-probe --json > "$RUNNER_TEMP/user.json"
          node scripts/ci-scenario.mjs user-brew "$RUNNER_TEMP/user.json"
          brew services stop nginx
      - name: root brew 서비스
        run: |
          sudo brew services start nginx
          sleep 5
          target/release/portwatch-probe
          target/release/portwatch-probe --json > "$RUNNER_TEMP/root.json"
          node scripts/ci-scenario.mjs root-brew "$RUNNER_TEMP/root.json"
          sudo brew services stop nginx
