name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mac:
        description: macOS 앱을 빌드해 artifact로 올린다
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  core:
    name: Linux / 코어 검사와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: rustup component add rustfmt clippy
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  mac:
    # macOS 실행 시간은 Linux보다 훨씬 비싸서 수동 실행에서만 돌린다(DC-10).
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac
    name: macOS / 앱 빌드
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: rustup component add clippy
      - run: npm ci --no-audit --no-fund
      - run: npm run check:app
      - run: npm run build:mac
      - name: 빌드 결과 확인
        run: |
          app=target/release/bundle/macos/portwatch.app
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/portwatch"
          ditto -c -k --keepParent "$app" portwatch-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: portwatch-macos-arm64
          path: portwatch-macos-arm64.zip
          retention-days: 14
